name: whipup
description: "냉장고 재료로 뚝딱 만드는 키친 컴패니언 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # ─── Core ─────────────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ─── State Management (Riverpod) ──────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ─── Data Modeling (Freezed) ──────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ─── Networking (Dio + Retrofit) ──────────────────────
  dio: ^5.7.0
  retrofit: ^4.4.1
  pretty_dio_logger: ^1.4.0

  # ─── Routing (go_router) ──────────────────────────────
  go_router: ^14.6.1

  # ─── Styling (FlexColorScheme) ────────────────────────
  flex_color_scheme: ^8.0.2

  # ─── Animation (Lottie) ───────────────────────────────
  lottie: ^3.1.3

  # ─── Localization (slang) ─────────────────────────────
  slang: ^4.3.0
  slang_flutter: ^4.3.0

  # ─── Forms ────────────────────────────────────────────
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: any   # intl 호환성으로 any 사용

  # ─── Mobile Core: Vision ──────────────────────────────
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.13.1

  # ─── Mobile Core: Audio ───────────────────────────────
  speech_to_text: ^7.0.0

  # ─── Storage (Isar) ───────────────────────────────────
  # TODO Phase 1.0: Isar 버전이 freezed analyzer와 충돌 가능 — Feature 브랜치에서 호환 버전 확인 후 추가
  # isar: ^3.1.0+1
  # isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4

  # ─── Security & Monitoring ────────────────────────────
  flutter_secure_storage: ^9.2.2
  sentry_flutter: ^8.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ─── Code Generation ──────────────────────────────────
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  retrofit_generator: ^9.1.5
  # isar_generator: ^3.1.0+1  # TODO: freezed analyzer 충돌 — Phase 1.0 스토리지 구현 시 호환 버전 적용

  # ─── Linting ──────────────────────────────────────────
  riverpod_lint: ^2.3.13
  custom_lint: ^0.7.0

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/images/
    - assets/columns/
